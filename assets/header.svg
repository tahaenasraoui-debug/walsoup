<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="Walid Elonk">
  <defs>
    <linearGradient id="soup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#d57624"/>
      <stop offset="55%"  stop-color="#e8a33d"/>
      <stop offset="100%" stop-color="#8b3a1f"/>
    </linearGradient>
    <style>
      .name { font: 700 46px ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
              fill: url(#soup); letter-spacing: -.5px; }
      .sub  { font: 400 15px ui-monospace, SFMono-Regular, Menlo, monospace;
              fill: #8b949e; letter-spacing: .3px; }
      .sq   { fill: none; stroke: url(#soup); stroke-width: 2.5; stroke-linecap: round; }
      .a { opacity: .5;  animation: drift 9s  ease-in-out infinite; }
      .b { opacity: .25; animation: drift 13s ease-in-out infinite reverse; }
      @keyframes drift { 0%,100% { transform: translateX(0) } 50% { transform: translateX(-28px) } }
    </style>
  </defs>

  <path class="sq a" d="M-40 152 q 30 -26 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0"/>
  <path class="sq b" d="M-40 180 q 30 -20 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0"/>

  <text class="name" x="44" y="88">Walid Elonk</text>
  <text class="sub"  x="46" y="118">@walsoup · offline-first · android · dsp</text>
</svg>
