<svg xmlns="http://www.w3.org/2000/svg" width="640" height="130" viewBox="0 0 640 130" role="img" aria-label="Deltarune Susie Dialogue">
  <style>
    .bg { fill: #000000; }
    .box-outer { fill: none; stroke: #FFFFFF; stroke-width: 2.5; }
    .box-inner { fill: none; stroke: #FFFFFF; stroke-width: 1.5; }
    .pixelated { image-rendering: pixelated; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges; }
    .portrait { image-rendering: pixelated; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges; }
    .t {
      font-family: ui-monospace, "Cascadia Code", Menlo, monospace;
      font-size: 15px;
      font-weight: 500;
      fill: #FFFFFF;
      letter-spacing: -0.2px;
    }
    .star { fill: #FFB627; font-weight: 700; }
    .prompt-arrow { fill: #FFB627; animation: blink-arrow 1.2s steps(1) infinite; }
    @keyframes susie-talk {
      0%, 6.6%, 13.3%, 20%, 26.6%, 33.3%, 40%, 100% { opacity: 0; }
      3.3%, 10%, 16.7%, 23.3%, 30%, 36.7% { opacity: 1; }
    }
    .mouth-open {
      animation: susie-talk 6s steps(1) infinite;
    }
    @keyframes blink-arrow {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes arrow-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #000000; }
      .box-outer { stroke: #FFFFFF; }
      .box-inner { stroke: #FFFFFF; }
      .t { fill: #FFFFFF; }
      .star { fill: #FFE800; }
      .prompt-arrow { fill: #FFE800; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mouth-open, .prompt-arrow {
        animation: none !important;
      }
      .mouth-open {
        opacity: 0 !important;
      }
      .prompt-arrow {
        opacity: 1 !important;
      }
    }
  </style>
  <rect class="bg" x="0" y="0" width="640" height="130" rx="4"/>
  <rect class="box-outer" x="5" y="5" width="630" height="120" rx="3"/>
  <rect class="box-inner" x="10" y="10" width="620" height="110" rx="2"/>
  <g id="susie-portrait">
    <image class="portrait pixelated" href="data:image/png;base64," x="20" y="14" width="90" height="102"/>
    <image class="portrait pixelated mouth-open" href="data:image/png;base64," x="20" y="14" width="90" height="102"/>
  </g>
  <g id="dialogue-text">
    <text class="t" x="126" y="43">
      <tspan class="star">* </tspan>Hey! You look like someone who&#8217;d spend 40 hours
    </text>
    <text class="t" x="126" y="69">
      <tspan fill="transparent">* </tspan>building an offline mesh instead of studying.
    </text>
    <text class="t" x="126" y="95">
      <tspan class="star">* </tspan>...Also, the soup thing is real. Don&#8217;t ask.
    </text>
  </g>
  <polygon class="prompt-arrow" points="608,102 618,102 613,109"/>
</svg>